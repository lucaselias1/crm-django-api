version: '3.8'

services:
  # --- CONTAINER DO BANCO DE DADOS ---
  db:
    image: postgres:16-alpine
    container_name: crm_postgres_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=crm_db
      - POSTGRES_USER=crm_user
      - POSTGRES_PASSWORD=crm_password
    ports:
      - "5432:5432"

  # --- CONTAINER DA SUA API DJANGO ---
  web:
    build: .
    container_name: crm_django_api
    # O comando abaixo aguarda o banco ligar, roda as migrações automaticamente e liga o servidor
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=crm_db
      - DB_USER=crm_user
      - DB_PASSWORD=crm_password
    depends_on:
      - db

volumes:
  postgres_data: