name: Django CI (Testes Automatizados)

# Define quando o robô vai rodar (a cada push ou pull request na branch main)
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
    # 1. Baixa o código do seu repositório na máquina virtual
    - name: Baixar código fonte
      uses: actions/checkout@v4

    # 2. Instala o Python na máquina virtual
    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' # Mude para a versão do seu Python se for diferente

    # 3. Instala as dependências do seu requirements.txt
    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 4. Roda os testes e mede a cobertura exatamente como você faz no terminal
    - name: Executar Testes com Coverage
      run: |
        coverage run --source='.' manage.py test clientes
        coverage report